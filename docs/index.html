<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Foody"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" type="image/png" href="favicon.png"><link rel="manifest" href="manifest.webmanifest"><script src="config.js"></script></head><body><title>Foody</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Kalorienbudget, Rezeptvorschläge, Einkaufsliste und Gewicht für zwei Personen">
<style>
/* Food Radar – Designsystem nach dem Aktien-Radar (dunkel zuerst).
   Layout: eine Spalte, Kacheln füllen auf dem iPhone den Bildschirm, Navigation unten. */
/* Mahlzeit – ruhige, warme Neutraltöne mit Salbei und Altrosa. Hell und dunkel. */
:root {
  --bg: #161413; --surface: #201d1b; --surface-2: #2a2623; --line: #38332f; --text: #efe9e2; --muted: #a79f96;
  --accent-text: var(--accent);
  --accent: #9dbaa6; --accent-2: #d9a79b; --accent-soft: #2a3630; --accent-ink: #16201a;
  --ok: #9dc4a8; --ok-soft: #26332b; --warn: #e3c07a; --warn-soft: #382f1c; --bad: #e59a8f; --bad-soft: #3b2724;
  --hot-1: #d9a79b; --hot-2: #c58a7e; --glass: rgba(22, 20, 19, .85);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .28);
  --glow: 0 0 0 1px rgba(157, 186, 166, .22), 0 8px 30px rgba(157, 186, 166, .08);
  --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --r-card: 22px; --r-box: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { 
    --bg: #f6f2ed; --surface: #fffdfa; --surface-2: #efe9e1; --line: #e2d9ce; --text: #2b2724; --muted: #675d55;
    --accent: #5f8570; --accent-2: #b8786b; --accent-soft: #e3ede6; --accent-ink: #ffffff;
    --ok: #4d7a5f; --ok-soft: #e1eee5; --warn: #8f6a1c; --warn-soft: #f7ecd2; --bad: #b4503f; --bad-soft: #f6e0db;
    --hot-1: #c9867a; --hot-2: #b8786b; --glass: rgba(246, 242, 237, .88);
    --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 8px 22px rgba(60, 40, 20, .07);
    --glow: 0 0 0 1px rgba(95, 133, 112, .2), 0 8px 24px rgba(95, 133, 112, .08);
    color-scheme: light;
   }
}
:root[data-theme="light"] { 
    --bg: #f6f2ed; --surface: #fffdfa; --surface-2: #efe9e1; --line: #e2d9ce; --text: #2b2724; --muted: #675d55;
    --accent: #5f8570; --accent-2: #b8786b; --accent-soft: #e3ede6; --accent-ink: #ffffff;
    --ok: #4d7a5f; --ok-soft: #e1eee5; --warn: #8f6a1c; --warn-soft: #f7ecd2; --bad: #b4503f; --bad-soft: #f6e0db;
    --hot-1: #c9867a; --hot-2: #b8786b; --glass: rgba(246, 242, 237, .88);
    --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 8px 22px rgba(60, 40, 20, .07);
    --glow: 0 0 0 1px rgba(95, 133, 112, .2), 0 8px 24px rgba(95, 133, 112, .08);
    color-scheme: light;
   }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num, .big, .kpi b, .ring span { font-variant-numeric: tabular-nums; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 116px; display: flex; flex-direction: column; gap: 14px; }

/* ------------------------------------------------------------------ Kopf */
.top { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding-top: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; margin-right: auto; }
.brand em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.radar { width: 30px; height: 30px; border-radius: 50%; position: relative; flex: 0 0 auto; border: 2px solid var(--accent); overflow: hidden;
  background: radial-gradient(circle, transparent 0 24%, var(--accent-soft) 25% 29%, transparent 30% 56%, var(--accent-soft) 57% 61%, transparent 62%); }
.radar::before { content: ""; position: absolute; inset: -2px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 68%, var(--accent) 100%); opacity: .8; animation: sweep 3.4s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }
.who { display: flex; gap: 6px; }
.who button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid transparent; background: var(--surface-2); color: var(--muted); font-weight: 800; cursor: pointer; }
.who button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--surface); box-shadow: 0 0 0 2px var(--hot-1); }
.datebar { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.datebar b { font-size: 15px; }
.datebar .sub { color: var(--muted); font-size: 13px; }
.iconbtn { min-width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-grid; place-items: center; padding: 0 10px; }

/* ------------------------------------------------------------------ Karten & Bausteine */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.row > div { min-width: 0; }
h2 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -.015em; text-wrap: balance; }
h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; }
.section-title h3 { font-size: 18px; }

.ring { --size: 72px; --p: 0; width: var(--size); height: var(--size); border-radius: 50%; display: grid; place-items: center; position: relative; flex: 0 0 auto;
  background: conic-gradient(currentColor calc(var(--p) * 1%), var(--surface-2) 0); color: var(--accent-text); }
.ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1; text-align: center; }
.ring small { display: block; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin-top: 2px; }
.f-hi { color: var(--ok); } .f-mid { color: var(--accent-text); } .f-low { color: var(--warn); } .f-bad { color: var(--bad); } .f-none { color: var(--muted); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 0; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent-text); }
.chip.hot { background: linear-gradient(90deg, var(--hot-1), var(--hot-2)); color: #fff; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; box-shadow: none; }
.chip.line { background: transparent; border: 1px solid var(--line); color: var(--text); }
button.chip { cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); box-shadow: inset 0 0 0 1px var(--accent); }

.strip { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--r-box); padding: 10px 14px; overflow-x: auto; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip .eyebrow { flex: 0 0 auto; }
.strip .v { display: flex; flex-direction: column; align-items: center; flex: 1 0 auto; line-height: 1.1; }
.strip .v b { font-size: 19px; color: var(--accent-text); }
.strip .v small { color: var(--muted); font-size: 12px; }
.strip .sep { color: var(--muted); }

/* Kalorienpotenzial / Budget: die hervorgehobene Box wie „Kurspotenzial“ */
.pot { border: 1.5px solid var(--accent); border-radius: 18px; padding: 14px 16px 12px; box-shadow: var(--glow);
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), var(--surface); display: flex; flex-direction: column; gap: 10px; }
.pot.over { border-color: var(--bad); box-shadow: 0 0 0 1px color-mix(in srgb, var(--bad) 30%, transparent), 0 8px 30px color-mix(in srgb, var(--bad) 14%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--bad) 12%, transparent), transparent 70%), var(--surface); }
.pot .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.big { font-size: clamp(32px, 10.5vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1; color: var(--accent-text); white-space: nowrap; }
.big small { font-size: 17px; letter-spacing: 0; margin-left: 4px; font-weight: 700; }
.pot.over .big { color: var(--bad); }
.pot .side { text-align: right; min-width: 0; }
.pot .side b { font-size: 18px; display: block; white-space: nowrap; }
.pot .side span { color: var(--muted); font-size: 13px; }
.track { position: relative; height: 34px; margin: 0 4px; }
.track .rail { position: absolute; left: 0; right: 0; top: 14px; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.track .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.track .fill.plan { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent-2) 70%, transparent) 0 6px, color-mix(in srgb, var(--accent-2) 35%, transparent) 6px 12px); border-radius: 0; }
.track .fill.over { background: var(--bad); }
.track .mark { position: absolute; top: 0; transform: translateX(-50%); width: 22px; height: 26px; color: var(--text); }
.track .mark.flag { color: var(--accent-2); transform: translateX(-2px); }
.legend { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.kv > div { min-width: 0; }
.kv .eyebrow { text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; }
.kv b { display: block; font-size: 22px; letter-spacing: -.01em; }
.kv small { color: var(--muted); font-size: 13px; }
.pos { color: var(--ok); } .neg { color: var(--bad); } .muted { color: var(--muted); }

.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.macro b { font-size: 18px; } .macro span { display: block; font-size: 12px; color: var(--muted); }
.mbar { height: 6px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.dots { display: inline-flex; gap: 6px; } .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-2); display: inline-block; } .dots i.on { background: var(--accent); }
.link { background: none; border: 0; color: var(--text); font-weight: 700; cursor: pointer; padding: 6px 0; }
.link.acc { color: var(--accent-text); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 44px; padding: 0 12px; border-radius: 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.note { font-size: 13px; color: var(--muted); }
.notice { border-radius: 14px; padding: 12px 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; }
.notice.acc { background: var(--accent-soft); color: var(--accent-text); }
.empty { border: 1px dashed var(--line); border-radius: var(--r-card); padding: 26px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--text); font-size: 16px; }

/* ------------------------------------------------------------------ Mahlzeiten */
.slot { display: flex; flex-direction: column; gap: 8px; }
.slot-head { display: flex; justify-content: space-between; align-items: center; }
.meal { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-box); background: var(--surface); }
.meal.eaten { background: color-mix(in srgb, var(--ok-soft) 45%, var(--surface)); }
.meal .thumb { width: 52px; height: 52px; border-radius: 12px; }
.meal .t { font-weight: 700; overflow-wrap: anywhere; }
.meal .m { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.meal .k { text-align: right; font-weight: 800; font-size: 17px; }
.meal .k small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.meal-acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dinner .meal { grid-template-columns: 1fr auto; padding: 0 0 14px; overflow: hidden; row-gap: 10px; }
.dinner .meal .thumb { grid-column: 1 / -1; width: 100%; height: 150px; border-radius: 0; }
.dinner .meal > div:not(.thumb) { padding: 0 14px; }
.dinner .meal .k { font-size: 22px; }
.status { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.status.gegessen { background: var(--ok-soft); color: var(--ok); }
.status.vorgemerkt { background: var(--accent-soft); color: var(--accent-text); }
.status.gekocht { background: var(--warn-soft); color: var(--warn); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 34px; height: 34px; border: 0; background: var(--surface-2); cursor: pointer; font-weight: 800; }
.stepper span { min-width: 52px; text-align: center; font-weight: 700; font-size: 13px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-box); background: var(--surface); cursor: pointer; width: 100%; text-align: left; }
.toggle .sw { width: 46px; height: 28px; border-radius: 99px; background: var(--surface-2); position: relative; flex: 0 0 auto; transition: background .2s; }
.toggle .sw::after { content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--text); top: 3px; left: 3px; transition: transform .2s; }
.toggle[aria-pressed="true"] .sw { background: var(--accent); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(18px); background: var(--accent-ink); }

/* ------------------------------------------------------------------ Bilder */
.thumb { background: var(--surface-2) center / cover no-repeat; position: relative; overflow: hidden; }
.ph { display: grid; place-items: center; font-weight: 800; letter-spacing: -.02em; color: color-mix(in srgb, var(--accent) 80%, var(--text));
  background: radial-gradient(circle at 70% 30%, transparent 0 18%, color-mix(in srgb, var(--accent) 16%, transparent) 19% 20%, transparent 21% 38%, color-mix(in srgb, var(--accent) 12%, transparent) 39% 40%, transparent 41%),
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--surface-2)), var(--surface-2)); }
.ph.fruehstueck { color: var(--warn); background-color: var(--warn-soft); }
.hero { height: 190px; border-radius: 16px; margin: -4px -4px 0; font-size: 46px; }

/* ------------------------------------------------------------------ Recipe Radar */
.deck { position: relative; display: grid; }
.deck > .card { grid-area: 1 / 1; }
.deck > .card.next { transform: scale(.96) translateY(10px); opacity: .55; pointer-events: none; }
.swipe { touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; }
.swipe.anim { transition: transform .3s cubic-bezier(.2, .7, .2, 1), opacity .3s; }
.stamp { position: absolute; top: 26px; padding: 6px 14px; border: 3px solid; border-radius: 12px; font-weight: 900; font-size: 22px; letter-spacing: .08em; opacity: 0; z-index: 3; pointer-events: none; }
.stamp.keep { left: 22px; color: var(--ok); transform: rotate(-12deg); }
.stamp.skip { right: 22px; color: var(--bad); transform: rotate(12deg); }
.actions { display: flex; justify-content: center; align-items: center; gap: 16px; position: sticky; z-index: 5; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); padding: 14px 0 8px; margin-top: -8px;
  background: linear-gradient(to bottom, transparent, var(--bg) 40%); }
.deck .hero { height: 140px; font-size: 40px; }
.round { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center; }
.round.skip { color: var(--bad); } .round.keep { color: var(--ok); width: 68px; height: 68px; } .round.fav { color: var(--hot-1); }
.round.fav[aria-pressed="true"] { background: linear-gradient(135deg, var(--hot-1), var(--hot-2)); color: #fff; border-color: transparent; }
.round.small { width: 48px; height: 48px; color: var(--muted); }
.why { font-size: 12.5px; color: var(--muted); }
.ings { display: flex; flex-wrap: wrap; gap: 6px; }
.ings span { font-size: 13px; padding: 4px 10px; border-radius: 8px; background: var(--surface-2); }
.minilist { display: flex; flex-direction: column; gap: 6px; }
.minilist div { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }


/* ------------------------------------------------------------------ Bibliothek */
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.rcard { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); cursor: pointer; text-align: left; padding: 0; box-shadow: var(--shadow); }
.rcard .thumb { height: 120px; font-size: 32px; }
.rcard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.rcard .t { font-weight: 800; line-height: 1.25; }
.rcard .m { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.rcard .m b { color: var(--accent-text); font-size: 15px; }
.star { color: var(--hot-1); }

/* ------------------------------------------------------------------ Formulare */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
input, select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; width: 100%; color: var(--text); }
textarea { min-height: 120px; resize: vertical; line-height: 1.4; }
input[type="range"] { padding: 0; min-height: 28px; accent-color: var(--accent); background: transparent; border: 0; }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }
.unsure { border-color: var(--hot-1) !important; box-shadow: 0 0 0 1px var(--hot-1); }
.fgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-items: end; }
.fgrid.three { grid-template-columns: repeat(3, 1fr); }
.fgrid .full { grid-column: 1 / -1; }
.ingrow { display: grid; grid-template-columns: 64px 70px 1fr 34px; gap: 6px; align-items: center; }
.ingrow select { grid-column: 1 / -2; min-height: 36px; padding: 4px 8px; font-size: 13px; }
.ingrow + .ingrow { border-top: 1px solid var(--line); padding-top: 8px; }
.formula { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.crop { position: relative; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.crop canvas { display: block; width: 100%; height: auto; }

/* ------------------------------------------------------------------ Tabellen & Listen */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl td, .tbl th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tbl td.r, .tbl th.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

      sig[coll] = s; cache[coll] = m; loaded[coll] = true; snapSave(coll); fireAll(coll);
    }
    let flushing = null;
    /** Schickt in der Warteschlange gesammelte Offline-Änderungen der Reihe nach ab. */
    function flush() {
      if (flushing || !outbox.length) return flushing || Promise.resolve();
      return (flushing = (async () => {
        try {
          while (outbox.length) {
            const o = outbox[0];
            try { await (o.data === null ? client.req(`/rest/v1/docs?path=eq.${enc(o.path)}`, { method: "DELETE" }) : upsert(o.path, o.data)); }
            catch (e) { if (isNet(e)) { if (!net.offline) { net.offline = true; emit(); } return; } if (e.code === "unauthenticated") return; /* sonst verwerfen, damit nichts hängt */ }
            outbox.shift(); sset("fr:outbox", outbox);
          }
          net.offline = false;
          for (const c of Object.keys(subs)) refreshColl(c, true).catch(() => {});
        } finally { flushing = null; emit(); }
      })());
    }
    /** Schreibt ein Dokument; ohne Netz landet die Änderung in der Warteschlange statt verloren zu gehen. */
    async function send(path, data, coll) {
      try { data === null ? await client.req(`/rest/v1/docs?path=eq.${enc(path)}`, { method: "DELETE" }) : await upsert(path, data); }
      catch (e) {
        if (!isNet(e)) { refreshColl(coll, true).catch(() => {}); throw e; }
        outbox = outbox.filter((o) => o.path !== path); outbox.push({ path, data }); sset("fr:outbox", outbox);
        net.offline = true; emit(); snapSave(coll);
      }
    }
    const write = async (coll, fn) => {
      pending[coll] = (pending[coll] || 0) + 1;
      try { return await fn(); } finally { pending[coll]--; }
    };
    const upsert = (path, data) => client.req("/rest/v1/docs?on_conflict=path", { method: "POST", headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify({ path, coll: split(path).coll, data }) });
    const invalid = (m) => Object.assign(new Error(m), { code: "invalid_argument" });

    function doc(path) {
      const { coll, id } = split(path);
      const getRemote = async () => {
        const r = await client.req(`/rest/v1/docs?path=eq.${enc(path)}&select=data`);
        const rows = await r.json();
        return rows.length ? rows[0].data : undefined;
      };
      const local = (d) => { if (!cache[coll]) cache[coll] = new Map(); if (d === undefined) cache[coll].delete(id); else cache[coll].set(id, d); if (loaded[coll]) fireAll(coll); };
      return {
        id, path,
        async get() { const d = loaded[coll] ? (cache[coll] || new Map()).get(id) : await getRemote(); return { id, exists: d !== undefined, data: () => (d === undefined ? undefined : clone(d)), metadata: {} }; },
        set: (data) => write(coll, async () => {
          if (!isObj(data)) throw invalid("Body muss ein Objekt sein");
          if (JSON.stringify(data).length > 256 * 1024) throw invalid("zu groß");
          local(clone(data)); // sofort anzeigen, Speichern läuft im Hintergrund
          await send(path, clone(data), coll); snapSave(coll);
        }),
        update: (data) => write(coll, async () => {
          const hit = loaded[coll] ? (cache[coll] || new Map()).get(id) : undefined;
          const cur = hit !== undefined ? clone(hit) : await getRemote();
          if (cur === undefined) throw invalid("Dokument existiert nicht");
          merge(cur, clone(data)); local(cur); // sofort anzeigen, Speichern läuft im Hintergrund
          await send(path, cur, coll); snapSave(coll);
        }),
        delete: () => write(coll, async () => { local(undefined); await send(path, null, coll); snapSave(coll); }),
      };
    }
    function collection(coll) {
      return {
        path: coll,
        doc: (id) => doc(coll + "/" + (id || Math.random().toString(36).slice(2))),
        onSnapshot(next, err) {
          const l = { fire: () => { if (loaded[coll]) next(snapOf(coll)); } };
          (subs[coll] = subs[coll] || new Set()).add(l);
          if (loaded[coll]) l.fire(); else refreshColl(coll, true).catch((e) => err && err(e));
          if (!timers[coll] && pollOf(coll) > 0) timers[coll] = setInterval(() => { if (typeof document !== "undefined" && document.hidden) return; if (outbox.length) flush().catch(() => {}); refreshColl(coll).catch(() => {}); }, pollOf(coll));
          return () => { subs[coll].delete(l); if (!subs[coll].size && timers[coll]) { clearInterval(timers[coll]); timers[coll] = null; } };
        },
      };
    }
    if (typeof root.addEventListener === "function") {
      root.addEventListener("online", () => { flush().catch(() => {}); for (const c of Object.keys(subs)) refreshColl(c, true).catch(() => {}); });
      root.addEventListener("offline", () => { net.offline = true; emit(); });
    }
    if (outbox.length) setTimeout(() => flush().catch(() => {}), 1500);
    return { doc, collection, flush, status: () => ({ ...net, queued: outbox.length }) };
  }

  /** Kleines Banner oben, solange offline oder Änderungen auf das Senden warten. */
  function netBanner() {
    if (typeof document === "undefined") return;
    const el = document.createElement("div");
    el.id = "fr-net"; el.setAttribute("role", "status");
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 6px);z-index:90;background:#2b2724;color:#fff;padding:6px 12px;border-radius:999px;font:700 13px system-ui,sans-serif;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)";
    document.body.appendChild(el);
    root.addEventListener("fr:net", (e) => {
      const d = e.detail || {};
      el.style.display = d.offline || d.queued ? "block" : "none";
      el.textContent = d.offline ? "Offline" + (d.queued ? " · " + d.queued + " Änderung" + (d.queued === 1 ? "" : "en") + " warten" : "") : "Sende " + d.queued + " Änderung" + (d.queued === 1 ? "" : "en") + " …";
    });
  }

  /** Bilder: öffentlicher Storage-Bucket "images"; ältere Bilder liegen als img/<id>.jpg im Repository. */
  function createAssets(client, cfg) {
    const rid = () => "u" + Array.from(root.crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join("");
    return {
      async upload(blob, o = {}) {
        const id = rid();
        await client.req(`/storage/v1/object/images/${id}`, { method: "POST", headers: { "Content-Type": o.type || blob.type || "image/jpeg", "x-upsert": "true" }, body: blob });
        return { id };
      },
      async delete(id) { if (/^u[0-9a-f]{24}$/.test(id)) await client.req(`/storage/v1/object/images/${id}`, { method: "DELETE" }); },
      url: (id) => (/^u[0-9a-f]{24}$/.test(id) ? `${cfg.url}/storage/v1/object/public/images/${id}` : `img/${id}.jpg`),
    };
  }

  /** Anmeldemaske; löst auf, sobald angemeldet. */
  let loginP = null;
  function loginScreen(client) {
    if (loginP) return loginP;
    return (loginP = new Promise((resolve) => {
      if (client.signedIn()) return resolve();
      const el = document.createElement("div");
      el.style.cssText = "position:fixed;inset:0;z-index:99;background:var(--bg,#f5f1ea);display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif";
      el.innerHTML = `<form style="width:100%;max-width:340px;display:grid;gap:12px"><h2 style="margin:0">Foody</h2><div style="opacity:.7;font-size:14px">Bitte anmelden</div>
        <input name="email" type="email" autocomplete="username" placeholder="E-Mail" required style="padding:12px;font-size:16px;border-radius:10px;border:1px solid #bbb">
        <input name="pw" type="password" autocomplete="current-password" placeholder="Passwort" required style="padding:12px;font-size:16px;border-radius:10px;border:1px solid #bbb">
        <button style="padding:12px;font-size:16px;border-radius:10px;border:0;background:#7a5a3a;color:#fff">Anmelden</button><div class="err" style="color:#b00;font-size:14px;min-height:18px"></div></form>`;
      document.body.appendChild(el);
      el.querySelector("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try { await client.login(String(fd.get("email")).trim(), String(fd.get("pw"))); el.remove(); resolve(); }
        catch (err) { el.querySelector(".err").textContent = err.message; }
      });
    }));
  }

  function install(cfg) {
    const client = createClient(cfg, null, root.localStorage);
    const db = createDb(client, { pollFor: (c) => (/^shopping/.test(c) ? 2500 : 0) });
    if (typeof document !== "undefined") { if (document.body) netBanner(); else document.addEventListener("DOMContentLoaded", netBanner); }
    if (typeof navigator !== "undefined" && navigator.serviceWorker && /^https?:/.test(root.location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
    const assets = createAssets(client, cfg);
    root.FR_ASSET = assets.url;
    root.FR_PHOTO = async (image) => { // Foto-Schätzung über die Supabase-Funktion meal-photo (nur eingeloggt, nur Vorschlag)
      try { const r = await client.req("/functions/v1/meal-photo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image }) }); return await r.json(); }
      catch (e) { let m = e && e.message || ""; try { m = JSON.parse(m).error || m; } catch (x) { /* kein JSON */ } throw new Error(e && e.code === "offline" ? "Kein Netz" : m || "Schätzung nicht möglich."); }
    };
    const downloads = { async save({ filename, data }) {
      const b = new Blob([typeof data === "string" ? data : JSON.stringify(data)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    } };
    const user = { can: async () => true };
    root.claude = { use: async (name) => {
      if (name === "db") { await loginScreen(client); const map = cfg.profiles || {}; const mine = map[String(client.email()).toLowerCase()]; if (mine) root.FR_PROFILE = mine; return db; }
      if (name === "assets") { await loginScreen(client); return assets; }
      if (name === "user") return user;
      if (name === "downloads") return downloads;
      return null; // sample (KI) gibt es hier nicht
    } };
  }

  const api = { createClient, createDb, createAssets, merge, install };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else if (root.FR_CONFIG && !root.claude) install(root.FR_CONFIG);
})(typeof window !== "undefined" ? window : globalThis);

</script>
<main id="app" class="wrap" aria-live="polite"></main>
<nav id="nav" class="bottom" aria-label="Hauptnavigation"></nav>
<div id="sheet"></div>
<div id="cook"></div>
<div id="toast"></div>
<script>
/* Food Radar – reine Berechnungen (ohne Datenbank, ohne Oberfläche).
 * Läuft im Browser (window.FRL) und in Node (module.exports) und wird in tests/ gegen
 * von Hand gerechnete Referenzwerte geprüft. */
(function (root, factory) {
  const m = factory();
  if (typeof module === "object" && module.exports) module.exports = m;
  else root.FRL = m;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // ======================================================================= Datum (lokale Kalendertage)
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = (now = new Date()) => iso(now);
  const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
  const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);

  // ======================================================================= Energiebedarf
  // PAL nach DGE: beschreibt den Alltag OHNE geplanten Sport. Sport wird separat angerechnet.
  const PAL_LEVELS = [
    [1.4, "Büro, wenig Bewegung"],
    [1.5, "Büro, moderate Bewegung"],
    [1.6, "Sitzend, zeitweise gehend"],
    [1.7, "Sitzend, oft gehend/stehend"],
    [1.8, "Überwiegend gehend/stehend"],
    [1.9, "Gehend/stehend, körperlich fordernd"],
  ];

  function ageOn(birthDate, ageYears, onISO) {
    if (birthDate) {
      const b = parseISO(birthDate), o = parseISO(onISO);
      let a = o.getFullYear() - b.getFullYear();
      if (o.getMonth() < b.getMonth() || (o.getMonth() === b.getMonth() && o.getDate() < b.getDate())) a--;
      return a;
    }
    return ageYears ?? null;
  }

  /** Grundumsatz nach Mifflin-St. Jeor (1990). */
  function bmrMifflin(sex, kg, cm, age) {
    const base = 10 * kg + 6.25 * cm - 5 * age;
    return sex === "m" ? base + 5 : base - 161;
  }

  /** Grundumsatz, PAL, Gesamtbedarf und Tagesziel – oder was fehlt. Nie ein erfundener Wert. */
  function energy(p, weightKg, onISO) {
    const age = ageOn(p.birthDate, p.ageYears, onISO);
    const missing = [["Größe", p.heightCm], ["Gewicht", weightKg], ["Alter", age]].filter(([, v]) => !v).map(([k]) => k);
    const out = { bmr: null, tdee: null, pal: p.pal, age, missing, goal: null, goalSource: null, warnings: [] };
    if (!missing.length) {
      const b = bmrMifflin(p.sex, weightKg, p.heightCm, age);
      out.bmr = Math.round(b);
      out.tdee = Math.round(b * p.pal);
    }
    const mode = p.goalMode || "halten";
    const deficit = Number(p.deficitKcal) || 0;
    if (mode === "manuell" && p.goalKcalManual) {
      out.goal = Math.round(p.goalKcalManual); out.goalSource = "manuell festgelegt";
    } else if (out.tdee != null && mode === "abnehmen") {
      out.goal = out.tdee - deficit; out.goalSource = `Bedarf − ${deficit} kcal Defizit`;
    } else if (out.tdee != null) {
      out.goal = out.tdee; out.goalSource = "Bedarf (Gewicht halten)";
    }
    if (out.goal != null && out.bmr != null && out.goal < out.bmr)
      out.warnings.push("Ziel liegt unter dem Grundumsatz – ein so großes Defizit nur mit ärztlicher Begleitung.");
    if (mode === "abnehmen" && deficit > 1000) out.warnings.push("Ein Defizit über 1.000 kcal pro Tag ist sehr hoch.");
    return out;
  }

  // ======================================================================= Tagesbudget
  /** Nur Aktivitäten mit gültigem Verbrauchswert zählen; der Sport-Haken allein bringt 0 kcal. */
  function sportCredit(acts, pct) {
    const valid = acts.reduce((s, a) => s + (a.kcal > 0 ? a.kcal : 0), 0);
    return Math.round((valid * (pct ?? 100)) / 100);
  }

  /** Aktuell verbleibend = Ziel + Sport − Gegessenes. Geplantes reduziert nur die Prognose. */
  function dayBudget(goal, sport, eaten, planned) {
    const sum = (l) => l.reduce((s, k) => s + (k == null ? 0 : k), 0);
    const res = {
      goal, sport, eaten: Math.round(sum(eaten)), planned: Math.round(sum(planned)),
      eatenUnknown: eaten.filter((k) => k == null).length, plannedUnknown: planned.filter((k) => k == null).length,
      remaining: null, afterPlan: null,
    };
    if (goal != null) {
      res.remaining = Math.round(goal + sport - sum(eaten));
      res.afterPlan = Math.round(goal + sport - sum(eaten) - sum(planned));
    }
    return res;
  }

  /** Wie gut passt ein Gericht ins aktuell verbleibende Budget? */
  function fit(kcal, remaining) {
    if (kcal == null || remaining == null) return { cls: "none", label: "unbekannt", pct: 0, after: null };
    const after = Math.round(remaining - kcal);
    if (remaining <= 0) return { cls: "bad", label: "Budget aufgebraucht", pct: 100, after };
    const share = kcal / remaining;
    const pct = Math.min(100, Math.round(share * 100));
    if (share <= 0.6) return { cls: "hi", label: "passt gut", pct, after };
    if (share <= 1.0) return { cls: "mid", label: "passt", pct, after };
    if (share <= 1.15) return { cls: "low", label: "knapp drüber", pct, after };
    return { cls: "bad", label: "sprengt Budget", pct, after };
  }

  // ======================================================================= Text und Einheiten
  function norm(t) {
    return String(t || "").toLowerCase().replace(/ß/g, "ss").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
      .normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  }

  const UNIT_ALIASES = {
    g: "g", gr: "g", gramm: "g", gram: "g", grams: "g", kg: "kg", kilo: "kg", kilogramm: "kg",
    ml: "ml", milliliter: "ml", cl: "cl", dl: "dl", l: "l", liter: "l", ltr: "l",
    el: "EL", essloeffel: "EL", essl: "EL", tbsp: "EL", tablespoon: "EL", tablespoons: "EL",
    tl: "TL", teeloeffel: "TL", teel: "TL", tsp: "TL", teaspoon: "TL", teaspoons: "TL",
    stueck: "Stück", stk: "Stück", st: "Stück", stck: "Stück", piece: "Stück", pieces: "Stück",
    zehe: "Zehe", zehen: "Zehe", clove: "Zehe", cloves: "Zehe", prise: "Prise", prisen: "Prise", pinch: "Prise",
    dose: "Dose", dosen: "Dose", can: "Dose", bund: "Bund", packung: "Packung", pck: "Packung", pckg: "Packung",
    becher: "Becher", tasse: "Tasse", tassen: "Tasse", cup: "cup", cups: "cup", scheibe: "Scheibe",
    scheiben: "Scheibe", handvoll: "Handvoll", msp: "Msp",
  };
  const VOLUME_ML = { ml: 1, cl: 10, dl: 100, l: 1000, EL: 15, TL: 5, cup: 236.6 };
  const MASS_G = { g: 1, kg: 1000 };

  const normUnit = (u) => { if (!u) return null; const k = norm(u).replace(/ /g, ""); return UNIT_ALIASES[k] || String(u).trim(); };
  const dimension = (u) => (u in MASS_G ? "mass" : u in VOLUME_ML ? "volume" : "count:" + (u || ""));

  // Zutaten, die ohne Mengenangabe energetisch vernachlässigbar sind (dokumentierte Regel)
  const NEGLIGIBLE = new Set(("salz pfeffer wasser gewuerz gewuerze kraeuter oregano basilikum petersilie schnittlauch dill " +
    "koriander muskat zimt kreuzkuemmel kurkuma currypulver curry paprikapulver chiliflocken chili lorbeer lorbeerblatt " +
    "thymian rosmarin minze essig zitronensaft limettensaft eis eiswuerfel").split(" "));
  const isNegligible = (name) => { const w = norm(name).split(" "); return w.some((x) => NEGLIGIBLE.has(x)); };

  /** Menge in Gramm. Ergebnis null, wenn es nur durch Raten ginge. */
  function toGrams(amount, unit, food) {
    if (unit === "Prise" || unit === "Msp") return [0, "Prise/Messerspitze = vernachlässigbar"];
    if (amount == null) return [null, "keine Menge"];
    if (unit in MASS_G) return [amount * MASS_G[unit], ""];
    if (unit in VOLUME_ML) {
      if (food && food.density) return [amount * VOLUME_ML[unit] * food.density, `Dichte ${food.density} g/ml`];
      return [null, "Volumen ohne bekannte Dichte"];
    }
    if (unit === "Stück" || unit === "Zehe" || !unit) {
      if (food && food.pieceG) return [amount * food.pieceG, `${food.pieceG} g je Stück`];
      return [null, "Stückgewicht unbekannt"];
    }
    return [null, `Einheit „${unit}“ nicht umrechenbar`];
  }

  const MACROS = ["kcal", "protein", "carbs", "fat"];
  const ZERO = { kcal: 0, protein: 0, carbs: 0, fat: 0 };

  function ingredientNutrition(ing, food) {
    if (ing.amount == null && ing.unit !== "Prise" && ing.unit !== "Msp" && isNegligible(ing.name))
      return { ok: true, grams: null, ...ZERO, note: "ohne Menge, vernachlässigbar" };
    if (!food) {
      if (isNegligible(ing.name) && ["Prise", "Msp", "TL", "EL"].includes(ing.unit))
        return { ok: true, grams: null, ...ZERO, note: "Gewürz, vernachlässigbar" };
      return { ok: false, grams: null, note: "kein Lebensmittel zugeordnet" };
    }
    const [g, note] = toGrams(ing.amount, ing.unit, food);
    if (g == null) return { ok: false, grams: null, note };
    const f = g / 100;
    const v = (x) => (x == null ? null : x * f);
    return { ok: true, grams: g, note, kcal: food.kcal * f, protein: v(food.protein), carbs: v(food.carbs), fat: v(food.fat) };
  }

  /** Nährwerte je Portion mit Datenqualität: Originalangabe > aus Zutaten berechnet > unvollständig.
   *  Basis „gesamt“ wird durch die Portionszahl geteilt – nie mit „je Portion“ verwechseln. */
  function recipeNutrition(recipe, foods) {
    const servings = recipe.servings || 1;
    const ings = recipe.ingredients || [];
    const total = { ...ZERO }, missing = [], gaps = new Set(), rows = [];
    for (const ing of ings) {
      const n = ingredientNutrition(ing, ing.foodId ? foods[ing.foodId] : null);
      rows.push({ ...ing, ...n });
      if (!n.ok) { missing.push(ing.name); continue; }
      for (const m of MACROS) { if (n[m] == null) gaps.add(m); else total[m] += n[m]; }
    }
    let computed = null;
    if (ings.length) { computed = {}; for (const m of MACROS) computed[m] = gaps.has(m) ? null : total[m] / servings; }
    const n = recipe.nutrition || {};
    let original = null;
    if (n.kcal != null && n.kcal !== "") {
      const div = n.basis === "gesamt" ? servings : 1;
      original = {}; for (const m of MACROS) original[m] = n[m] == null || n[m] === "" ? null : Number(n[m]) / div;
    }
    let per, quality;
    if (original) { per = original; quality = n.quality || "original"; }
    else if (computed && !missing.length) { per = computed; quality = "berechnet"; }
    else if (computed && missing.length < ings.length) { per = computed; quality = "unvollstaendig"; }
    else { per = { kcal: null, protein: null, carbs: null, fat: null }; quality = "fehlt"; }
    let deviationPct = null;
    if (original && computed && !missing.length && original.kcal) deviationPct = Math.round(((computed.kcal - original.kcal) / original.kcal) * 100);
    const rnd = (d) => { if (!d) return null; const o = {}; for (const m of MACROS) o[m] = d[m] == null ? null : m === "kcal" ? Math.round(d[m]) : Math.round(d[m] * 10) / 10; return o; };
    return { perPortion: rnd(per), quality, missing, rows, computed: rnd(computed), original: rnd(original), deviationPct, servings };
  }

  const QUALITY_LABEL = { original: "Originalwert", geschaetzt: "geschätzt", berechnet: "geschätzt (aus Zutaten)", unvollstaendig: "unvollständig", fehlt: "keine Nährwerte" };

  /** „Proteinreich“ nach EU-VO 1924/2006: mindestens 20 % der Energie aus Protein. */
  const derivedTags = (per) => (per && per.kcal > 0 && per.protein != null && (per.protein * 4) / per.kcal >= 0.2 ? ["proteinreich"] : []);
  const effortFromMinutes = (m) => (m == null || m === "" ? null : m <= 20 ? "leicht" : m <= 45 ? "mittel" : "aufwendig");

  // ======================================================================= Einkauf
  /** Zutaten zusammenfassen. lines: {name, amount, unit, factor, source}.
   *  Gleiche Zutat + gleiche Dimension wird addiert (g mit kg, ml mit l/EL/TL), sonst getrennte Posten. */
  function shoppingAggregate(lines) {
    const groups = new Map();
    for (const ln of lines) {
      const dim = dimension(ln.unit);
      const key = norm(ln.name) + "|" + dim;
      if (!groups.has(key)) groups.set(key, { key, name: ln.name.trim(), dim, parts: [], sources: [], noAmount: false });
      const g = groups.get(key);
      if (!g.sources.includes(ln.source)) g.sources.push(ln.source);
      if (ln.amount == null) g.noAmount = true; else g.parts.push([ln.amount * ln.factor, ln.unit]);
    }
    const out = [];
    for (const g of groups.values()) {
      let amount = null, unit = null;
      if (g.parts.length) {
        const units = new Set(g.parts.map((p) => p[1]));
        if (units.size === 1) { unit = g.parts[0][1]; amount = g.parts.reduce((s, p) => s + p[0], 0); }
        else if (g.dim === "mass") { unit = "g"; amount = g.parts.reduce((s, p) => s + p[0] * MASS_G[p[1]], 0); }
        else if (g.dim === "volume") { unit = "ml"; amount = g.parts.reduce((s, p) => s + p[0] * VOLUME_ML[p[1]], 0); }
        if (unit === "g" && amount >= 1000) { amount /= 1000; unit = "kg"; }
        if (unit === "ml" && amount >= 1000) { amount /= 1000; unit = "l"; }
        amount = Math.round(amount * 100) / 100;
      }
      out.push({ key: g.key, name: g.name, amount, unit, sources: g.sources.join(", "), extra: g.noAmount && amount != null });
    }
    return out.sort((a, b) => norm(a.name).localeCompare(norm(b.name)));
  }

  // ======================================================================= Portionen umrechnen
  /** Menge auf eine andere Portionszahl umrechnen und küchentauglich runden (Eigenentwicklung, keine Fremdbibliothek).
   *  g/ml: bis 10 auf 0,5 · bis 100 auf 5 · darüber auf 10; kg/l auf 0,05; EL/TL auf 0,25; Stück und Sonstiges auf 0,5 (ab 5 ganze Zahlen). */
  function scaleAmount(amount, unit, factor) {
    if (amount == null || amount === "" || isNaN(Number(amount))) return { amount: null, unit: unit || null };
    const v = Number(amount) * factor;
    const step = (x, s) => Math.round(x / s) * s;
    const clean = (x) => Math.round(x * 1000) / 1000;
    let a, u = unit || null;
    if (u === "g" || u === "ml") {
      a = v < 10 ? step(v, 0.5) : v < 100 ? step(v, 5) : step(v, 10);
      if (a >= 1000) { a = step(a / 1000, 0.05); u = u === "g" ? "kg" : "l"; }
    } else if (u === "kg" || u === "l") a = step(v, 0.05);
    else if (u === "EL" || u === "TL") a = step(v, 0.25);
    else a = v < 5 ? step(v, 0.5) : Math.round(v);
    if (a <= 0 && v > 0) a = u === "EL" || u === "TL" ? 0.25 : 0.5;
    return { amount: clean(a), unit: u };
  }

  // ======================================================================= Gewicht
  /** Exponentiell geglätteter Trend (dämpft Wasser- und Verdauungsschwankungen). */
  function weightTrend(values, alpha = 0.25) {
    let t = null;
    return values.map((v) => { t = t == null ? v : t + alpha * (v - t); return Math.round(t * 100) / 100; });
  }

  function weightSummary(entries, target) {
    if (!entries.length) return { start: null, current: null, delta: null, deltaPct: null, progress: null, toGo: null };
    const start = entries[0].kg, current = entries[entries.length - 1].kg;
    const delta = Math.round((current - start) * 10) / 10;
    const res = { start, current, delta, deltaPct: Math.round((delta / start) * 1000) / 10, progress: null, toGo: null };
    if (target != null && target !== "" && Number(target) !== start) {
      res.progress = Math.max(0, Math.min(100, Math.round(((start - current) / (start - target)) * 100)));
      res.toGo = Math.round((current - target) * 10) / 10;
    }
    return res;
  }

  // ======================================================================= Rezept-Parser
  const FRACTIONS = { "½": 0.5, "¼": 0.25, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": 0.125 };
  const NUM = "\\d+(?:[.,]\\d+)?";
  const FR = "[½¼¾⅓⅔⅛]";
  const AMOUNT_RE = new RegExp(`^(\\d+\\s+\\d+\\s*/\\s*\\d+|\\d+\\s*/\\s*\\d+|${NUM}\\s*${FR}|${FR}|${NUM}(?:\\s*[-–]\\s*${NUM})?)\\s*(.*)$`);
  const TRAIL_RE = new RegExp(`^(.+?)[\\s:(,]+(${NUM}|\\d+\\s*/\\s*\\d+)\\s*([A-Za-zäöüÄÖÜ.]+)?\\)?\\s*$`);
  const BULLET_RE = /^[-*•·▪◦–—>□☐✓✔]+\s*/;

  function num(s) {
    s = s.trim();
    for (const [ch, v] of Object.entries(FRACTIONS)) if (s.endsWith(ch)) { const h = s.slice(0, -1).trim(); return (h ? parseFloat(h.replace(",", ".")) : 0) + v; }
    if (s.includes("/")) {
      const parts = s.split(/\s+/);
      const whole = parts.length === 2 ? parseFloat(parts[0]) : 0;
      const [a, b] = (parts.length === 2 ? parts[1] : s.replace(/\s/g, "")).split("/");
      return whole + parseFloat(a) / parseFloat(b);
    }
    return parseFloat(s.replace(",", "."));
  }

  const isUnitWord = (w) => !!w && norm(w).replace(/ /g, "") in UNIT_ALIASES;

  function parseIngredient(line) {
    const raw = String(line).trim();
    const text = raw.replace(BULLET_RE, "").trim();
    const res = { raw, name: text, amount: null, unit: null, unsure: [] };
    const m = text.match(AMOUNT_RE);
    if (m && m[2]) {
      const a = m[1];
      if (/[-–]/.test(a)) { res.amount = num(a.split(/[-–]/)[0]); res.unsure.push(`Mengenbereich „${a}“ – untere Grenze übernommen`); }
      else res.amount = num(a);
      let rest = m[2];
      const u = rest.match(/^([A-Za-zäöüÄÖÜß]+)\.?\s*(.*)$/);
      if (u && isUnitWord(u[1])) { res.unit = normUnit(u[1]); rest = u[2]; }
      res.name = rest.replace(/^[\s,:-]+|[\s,:-]+$/g, "") || text;
    } else {
      const t = text.match(TRAIL_RE);
      if (t && (!t[3] || isUnitWord(t[3]))) {
        res.name = t[1].replace(/^[\s,:(-]+|[\s,:(-]+$/g, "");
        res.amount = num(t[2]);
        res.unit = t[3] ? normUnit(t[3]) : null;
      }
    }
    if (res.amount == null && !isNegligible(res.name)) res.unsure.push("keine Menge erkannt");
    return res;
  }

  /** Lebensmittel mit dem längsten passenden Namen/Alias (ganze Wörter). */
  function matchFood(name, foods) {
    const padded = " " + norm(name) + " ";
    let best = null, bestLen = 0;
    for (const f of foods) {
      const cands = [norm(f.name), ...String(f.aliases || "").split(",").map(norm)];
      for (const a of cands) if (a && padded.includes(" " + a + " ") && a.length > bestLen) { best = f.id; bestLen = a.length; }
    }
    return best;
  }

  const H_ING = /^(zutaten|ingredients|du brauchst|das brauchst du|einkaufsliste)\b/i;
  const H_STEP = /^(zubereitung|anleitung|so geht'?s|so wird'?s gemacht|schritte|instructions|method|directions|preparation)\b/i;
  const H_NUT = /^(nährwerte|naehrwerte|nutrition|nährwertangaben)\b/i;
  const META = /(\bkcal\b|portion|person|\bmin\b|minuten|\bstunden?\b|schwierigkeit|zubereitungszeit|arbeitszeit)/i;
  const STEP_START = /^\s*(?:schritt\s*)?(\d{1,2})[.):]\s*/i;

  const findNum = (re, t) => { const m = t.match(re); return m ? parseFloat(m[1].replace(",", ".")) : null; };

  function parseNutrition(text) {
    const flat = text.replace(/\s+/g, " ");
    let kcal = findNum(new RegExp(`(${NUM})\\s*(?:kcal|kilokalorien)\\b`, "i"), flat);
    if (kcal == null) kcal = findNum(/(?:kalorien|energie|brennwert|calories)\D{0,12}?(\d{2,4})(?!\s*kj)/i, flat);
    const g = (names) => findNum(new RegExp(`(?:${names})\\D{0,10}?(${NUM})\\s*g\\b`, "i"), flat) ?? findNum(new RegExp(`(${NUM})\\s*g\\s*(?:${names})\\b`, "i"), flat);
    const out = { kcal, protein: g("protein|eiwei(?:ß|ss)"), carbs: g("kohlenhydrate?|carbs?|\\bkh"), fat: g("\\bfett|\\bfat"), basis: "portion", unsure: [] };
    if (out.kcal != null) {
      if (/(pro|je|per|\/)\s*(portion|person|serving|stück|stueck)/i.test(flat)) { /* eindeutig */ }
      else if (/(pro|je|per)\s*100\s*(g|ml)/i.test(flat)) {
        out.unsure.push("Nährwerte beziehen sich auf 100 g – nicht übernommen, bitte je Portion eintragen");
        Object.assign(out, { kcal: null, protein: null, carbs: null, fat: null });
      } else if (/(gesamt|insgesamt|total|ganzes rezept)/i.test(flat)) out.basis = "gesamt";
      else out.unsure.push("Bezug der Nährwerte nicht angegeben – als „je Portion“ angenommen");
    }
    return out;
  }

  function parseTime(head) {
    const flat = head.replace(/\s+/g, " ");
    const toMin = (v, u) => (/^(s|h)/i.test(u) ? Number(v) * 60 : Number(v));
    const tot = flat.match(/(gesamtzeit|gesamt|total(?: time)?)\D{0,12}?(\d+)\s*(min|minuten|std|stunden|h)\b/i);
    if (tot) return [toMin(tot[2], tot[3]), []];
    const re = /(arbeitszeit|zubereitungszeit|vorbereitung|kochzeit|backzeit|garzeit|prep time|cook time)\D{0,12}?(\d+)\s*(min|minuten|std|stunden|h)\b/gi;
    const labeled = [...flat.matchAll(re)];
    if (labeled.length) return [labeled.reduce((s, m) => s + toMin(m[2], m[3]), 0), labeled.length > 1 ? ["Zeiten addiert: " + labeled.map((m) => m[0]).join(", ")] : []];
    const m = flat.match(/(\d+)\s*(min\.?|minuten)\b/i);
    return m ? [Number(m[1]), ["Zeit ohne Beschriftung erkannt"]] : [null, []];
  }

  function parseServings(text) {
    const flat = text.replace(/\s+/g, " ");
    for (const re of [/(\d+)\s*(portionen|portion|personen|person|servings|serves)\b/i, /\bfür\s+(\d+)\b/i, /(?:portionen|servings|serves)\D{0,4}(\d+)/i]) {
      const m = flat.match(re);
      if (m) return Number(m[1]);
    }
    return null;
  }

  function finish(r, unsure) {
    const missing = [];
    if (!r.title) missing.push("Titel");
    if (!r.ingredients.length) missing.push("Zutaten");
    else if (r.ingredients.some((i) => i.amount == null && !isNegligible(i.name))) missing.push("Mengen einzelner Zutaten");
    if (!r.servings) missing.push("Portionszahl");
    if (!r.instructions) missing.push("Zubereitungsschritte");
    if (!r.prepMinutes) missing.push("Zubereitungszeit");
    if (r.nutrition.kcal == null) missing.push("Nährwerte");
    r.missing = missing; r.unsure = unsure;
    return r;
  }

  /** Freitext (OCR, iPhone-Livetext, Kopie) oder JSON → strukturierte Rezeptdaten. Nichts wird erfunden. */
  function parseRecipeText(text) {
    const st = String(text || "").trim();
    if (st.startsWith("{")) { try { return parseRecipeJson(JSON.parse(st)); } catch (e) { /* weiter als Text */ } }
    const lines = st.replace(/\r/g, "").split("\n").map((l) => l.trim());
    let section = "head";
    const head = [], ing = [], step = [];
    for (const ln of lines) {
      if (!ln) continue;
      if (H_ING.test(ln)) { section = "ing"; head.push(ln); const rest = ln.replace(H_ING, "").replace(/^[\s:]+/, ""); if (rest && !META.test(rest) && AMOUNT_RE.test(rest)) ing.push(rest); continue; }
      if (H_STEP.test(ln)) { section = "step"; continue; }
      if (H_NUT.test(ln)) { section = "nut"; continue; }
      ({ head, ing, step, nut: head })[section].push(ln);
    }
    const unsure = [];
    let title = null;
    for (const ln of head) {
      if (H_ING.test(ln) || META.test(ln) || /^(https?:\/\/|www\.|@|\d|[½¼¾])/.test(ln) || ln.length > 90) continue;
      if ((ln.match(/[A-Za-zÄÖÜäöüß]/g) || []).length >= 3) { title = ln.replace(/^[\s#*]+|[\s#*]+$/g, ""); break; }
    }
    if (!ing.length) {
      for (const ln of head) if (AMOUNT_RE.test(ln) && /^\S*\d|^[½¼¾]/.test(ln) && !META.test(ln)) ing.push(ln);
      if (ing.length) unsure.push("Keine Überschrift „Zutaten“ gefunden – Zutaten anhand der Mengen erkannt");
    }
    const steps = [];
    for (const ln of step) {
      if (STEP_START.test(ln) || !steps.length || /[.!:]$/.test(steps[steps.length - 1])) steps.push(ln.replace(STEP_START, ""));
      else steps[steps.length - 1] += " " + ln; // Zeilenumbruch aus der Texterkennung zusammenführen
    }
    const [minutes, tUnsure] = parseTime(head.join("\n"));
    const nut = parseNutrition(st);
    const src = st.match(/(https?:\/\/\S+|www\.\S+|@[\w.]{3,})/);
    unsure.push(...tUnsure, ...nut.unsure);
    delete nut.unsure;
    return finish({
      title, servings: parseServings(head.join("\n")), prepMinutes: minutes,
      ingredients: ing.filter((l) => l.length > 1).map(parseIngredient), instructions: steps.join("\n"),
      nutrition: nut, source: src ? src[1] : "", category: null, tags: "", photoBox: null,
    }, unsure);
  }

  /** Strukturierte Daten eines Extraktors (Claude liest den Screenshot). */
  function parseRecipeJson(d) {
    const ings = (d.ingredients || []).map((it) => (typeof it === "string" ? parseIngredient(it) : {
      raw: it.raw || it.name || "", name: it.name || "", amount: it.amount == null || it.amount === "" ? null : Number(it.amount),
      unit: normUnit(it.unit), unsure: [...(it.unsure || [])],
    }));
    for (const i of ings) if (i.amount == null && !isNegligible(i.name) && !i.unsure.includes("keine Menge erkannt")) i.unsure.push("keine Menge erkannt");
    const nut = d.nutrition || {};
    const numOrNull = (v) => (v == null || v === "" || isNaN(Number(v)) ? null : Number(v));
    const steps = d.steps || d.instructions || "";
    return finish({
      title: d.title || null, servings: numOrNull(d.servings), prepMinutes: numOrNull(d.prep_minutes ?? d.prepMinutes),
      ingredients: ings, instructions: Array.isArray(steps) ? steps.join("\n") : steps,
      nutrition: { kcal: numOrNull(nut.kcal), protein: numOrNull(nut.protein), carbs: numOrNull(nut.carbs), fat: numOrNull(nut.fat), basis: nut.basis === "gesamt" ? "gesamt" : "portion" },
      source: d.source || "", category: ["fruehstueck", "main", "mittag", "abend", "snack"].includes(d.category) ? d.category : null,
      tags: Array.isArray(d.tags) ? d.tags.join(", ") : d.tags || "", photoBox: d.photo_box || d.photoBox || null,
    }, [...(d.unsure || [])]);
  }

  // ======================================================================= Bildausschnitt
  /** Größter farbiger Fotobereich in einem verkleinerten Screenshot (Text ist meist farblos).
   *  img: {width, height, data: RGBA}. Ergebnis in Prozent {l, t, r, b} oder null. */
  function detectPhotoBox(img) {
    const { width: w, height: h, data } = img;
    const photo = (x, y) => {
      const i = (y * w + x) * 4, r = data[i], g = data[i + 1], b = data[i + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const s = mx ? ((mx - mn) / mx) * 255 : 0;
      return s > 35 && mx > 35 && mx < 235;
    };
    const rows = [];
    for (let y = 0; y < h; y++) { let c = 0; for (let x = 0; x < w; x++) c += photo(x, y); rows.push(c / w > 0.35); }
    let best = [0, -1], cur = null, gap = 0;
    rows.concat([false, false, false, false]).forEach((ok, y) => {
      if (ok) { cur = cur || [y, y]; cur[1] = y; gap = 0; }
      else if (cur && ++gap > 2) { if (cur[1] - cur[0] > best[1] - best[0]) best = cur; cur = null; gap = 0; }
    });
    if (best[1] - best[0] + 1 < 0.12 * h) return null;
    const [y0, y1] = best;
    const xs = [];
    for (let x = 0; x < w; x++) { let c = 0; for (let y = y0; y <= y1; y++) c += photo(x, y); if (c / (y1 - y0 + 1) > 0.3) xs.push(x); }
    const x0 = xs.length ? xs[0] : 0, x1 = xs.length ? xs[xs.length - 1] : w - 1;
    const pc = (v, t) => Math.round((v / t) * 1000) / 10;
    return { l: pc(x0, w), t: pc(y0, h), r: pc(x1 + 1, w), b: pc(y1 + 1, h) };
  }

  // ======================================================================= Recipe-Radar-Rotation
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { let a = hashStr(seed); return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /** Nachvollziehbare Gewichtung; jede Regel hinterlässt einen sichtbaren Grund.
   *  c: {today, remaining, slot, maxMinutes, favorites:Set, taken:Set, lastShown:{id:date}, lastEaten:{id:date}, skipped:Set, dislikes:[], likes:[]} */
  function scoreCandidates(recipes, c) {
    const out = [];
    for (const r of recipes) {
      if (c.taken.has(r.id)) continue;
      if (c.slot && r.category !== c.slot) continue;
      if (c.maxMinutes && (r.prepMinutes == null || r.prepMinutes > c.maxMinutes)) continue;
      const text = " " + norm(r.title + " " + (r.ingredients || []).map((i) => i.name).join(" ")) + " ";
      if ((c.dislikes || []).some((x) => x && text.includes(" " + norm(x) + " "))) continue;
      let w = 1; const why = [];
      if (c.favorites.has(r.id)) { w *= 3; why.push("Favorit"); }
      if (c.lastShown[r.id]) {
        const d = daysBetween(c.lastShown[r.id], c.today);
        const f = d <= 1 ? 0.25 : d <= 3 ? 0.5 : d <= 7 ? 0.8 : 1;
        w *= f; if (f < 1) why.push(`vor ${d} T. gezeigt`);
      } else why.push("neu im Radar");
      if (c.lastEaten[r.id]) {
        const d = daysBetween(c.lastEaten[r.id], c.today);
        const f = d <= 2 ? 0.2 : d <= 6 ? 0.5 : d <= 13 ? 0.8 : 1;
        w *= f; why.push(f < 1 ? `vor ${d} T. gegessen` : "lange nicht gegessen");
      }
      if (c.skipped.has(r.id)) w *= 0.6;
      const kcal = r.nut ? r.nut.perPortion.kcal : null;
      if (kcal == null) w *= 0.7;
      else if (c.remaining != null) {
        const ft = fit(kcal, c.remaining);
        w *= { hi: 1.2, mid: 1, low: 0.6, bad: 0.3 }[ft.cls] || 1;
        if (ft.cls === "hi" || ft.cls === "mid") why.push("passt ins Budget");
      }
      const tags = norm((r.tags || []).join(" ") + " " + (r.autoTags || []).join(" "));
      if ((c.likes || []).some((x) => x && tags.includes(norm(x)))) { w *= 1.3; why.push("Vorliebe"); }
      out.push({ recipe: r, weight: Math.round(w * 1000) / 1000, why });
    }
    return out;
  }

  /** Gewichtete Zufallsauswahl ohne Zurücklegen (Efraimidis-Spirakis), reproduzierbar je Tag und Person. */
  function weightedPick(cands, seed, n) {
    const rand = rng(seed);
    return cands.map((c) => ({ c, k: -Math.log(rand() || 1e-12) / Math.max(c.weight, 1e-6) }))
      .sort((a, b) => a.k - b.k).slice(0, n).map((x) => x.c);
  }

  // ======================================================================= Historie
  /** Kennzahlen nur aus vollständig dokumentierten Tagen; leere Tage werden nie gewertet. */
  function historyStats(days) {
    const full = days.filter((d) => d.complete && !d.unknown);
    const withGoal = full.filter((d) => d.deviation != null);
    const prot = full.filter((d) => d.protein != null).map((d) => d.protein);
    const avg = (l) => Math.round(l.reduce((s, x) => s + x, 0) / l.length);
    return {
      completeDays: full.length,
      partialDays: days.filter((d) => d.hasData && !(d.complete && !d.unknown)).length,
      avgKcal: full.length ? avg(full.map((d) => d.eaten)) : null,
      avgDev: withGoal.length ? avg(withGoal.map((d) => d.deviation)) : null,
      hitRate: withGoal.length ? Math.round((100 * withGoal.filter((d) => d.hit).length) / withGoal.length) : null,
      avgProtein: prot.length >= 3 ? avg(prot) : null,
    };
  }

  // ======================================================================= Anzeige
  function de(v, digits = 0) {
    if (v == null || v === "" || isNaN(v)) return "–";
    return Number(v).toLocaleString("de-DE", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  const deAmount = (v) => (v == null ? "" : Number(v).toLocaleString("de-DE", { maximumFractionDigits: 2 }));

  return {
    todayISO, addDays, parseISO, daysBetween, PAL_LEVELS, ageOn, bmrMifflin, energy, sportCredit, dayBudget, fit,
    norm, UNIT_ALIASES, VOLUME_ML, MASS_G, normUnit, dimension, isNegligible, toGrams, ingredientNutrition,
    recipeNutrition, QUALITY_LABEL, derivedTags, effortFromMinutes, shoppingAggregate, scaleAmount, weightTrend, weightSummary,
    parseIngredient, matchFood, parseNutrition, parseTime, parseServings, parseRecipeText, parseRecipeJson,
    detectPhotoBox, scoreCandidates, weightedPick, historyStats, de, deAmount, MACROS,
  };
});

</script>
<script>
/* Food Radar – Datenzugriff und Aktionen über die Artifact-Datenbank (db-Capability).
 *
 * Datenmodell (Dokumentpfade):
